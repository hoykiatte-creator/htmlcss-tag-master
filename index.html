<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TagMaster — HTML & CSS 마스터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0c10; --bg2:#12151c; --bg3:#1a1f29; --bg4:#252b38;
    --border:#242b38; --border2:#384252;
    --text:#f0f2f5; --text2:#a0aec0; --text3:#64748b;
    --accent:#7c6af7; --accent2:#5a4fd4;
    --green:#10b981; --green-bg:#064e3b; --green-border:#065f46;
    --red:#ef4444; --red-bg:#451a1a; --red-border:#7f1d1d;
    --amber:#f59e0b; --amber-bg:#451a03;
    --teal:#14b8a6; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; min-height:100vh; overflow-x:hidden;}
  .app{max-width:640px; margin:0 auto; padding:0 1.25rem; min-height:100vh; display:flex; flex-direction:column;}
  .screen{display:none; flex-direction:column; flex:1; padding:2rem 0; animation:fadeIn 0.4s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .screen.active{display:flex;}

  /* Header & Stats */
  .topnav{display:flex; align-items:center; justify-content:space-between; padding:1rem; background:var(--bg2); border:1px solid var(--border); border-radius:16px; margin-bottom:1.5rem;}
  .badge{display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:10px; font-family:var(--mono); font-size:13px; font-weight:600;}
  .badge-xp{background:#1e1b4b; color:#a5b4fc; border:1px solid #312e81;}
  .hearts{display:flex; gap:4px;}
  .heart{font-size:18px; transition:transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
  .heart.dead{filter:grayscale(1); opacity:0.2;}

  /* Home Hero */
  .hero{text-align:center; padding:1rem 0 2.5rem;}
  .logo{font-family:var(--mono); font-size:36px; font-weight:800; letter-spacing:-1.5px; margin-bottom:8px;}
  .logo span{color:var(--accent);}
  .tagline{color:var(--text3); font-size:14px; font-family:var(--mono);}

  /* Grid Layouts */
  .section-title{font-size:12px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:1rem; display:block;}
  .grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-bottom:2rem;}
  .card{background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:1.25rem; cursor:pointer; transition:all 0.2s; position:relative;}
  .card:hover{border-color:var(--border2); transform:translateY(-2px); background:var(--bg3);}
  .card.sel{border-color:var(--accent); background:#1e1b4b;}
  .card-icon{font-size:24px; margin-bottom:12px; display:block;}
  .card-title{font-size:15px; font-weight:600; display:block; margin-bottom:4px;}
  .card-sub{font-size:12px; color:var(--text3);}

  /* Quiz UI */
  .q-card{background:var(--bg2); border:1px solid var(--border); border-radius:24px; padding:2rem; margin-bottom:1.5rem; box-shadow:0 10px 30px rgba(0,0,0,0.3);}
  .q-type{display:inline-block; padding:4px 10px; border-radius:8px; font-family:var(--mono); font-size:11px; font-weight:700; margin-bottom:1.5rem; text-transform:uppercase; background:var(--accent); color:#fff;}
  .q-question{font-size:18px; font-weight:600; line-height:1.6; margin-bottom:1.5rem;}
  
  .code-view{background:#000; border:1px solid var(--border2); border-radius:12px; padding:1.25rem; font-family:var(--mono); font-size:14px; line-height:1.7; margin-bottom:1.5rem; color:#d1d5db; position:relative; white-space: pre-wrap;}
  .blank{color:var(--teal); font-weight:700; border-bottom:2px solid var(--teal); padding:0 8px;}

  .options{display:grid; gap:10px;}
  .btn-opt{background:var(--bg3); border:1px solid var(--border); border-radius:14px; padding:1rem 1.25rem; color:var(--text); font-family:var(--mono); font-size:14px; text-align:left; cursor:pointer; transition:all 0.15s;}
  .btn-opt:hover:not(:disabled){border-color:var(--accent); background:var(--bg4);}
  .btn-opt.correct{background:var(--green-bg); border-color:var(--green); color:var(--green); font-weight:700;}
  .btn-opt.wrong{background:var(--red-bg); border-color:var(--red); color:var(--red);}

  .explainer{margin-top:1.5rem; padding:1.25rem; border-radius:16px; font-size:14px; line-height:1.6; display:none; animation:slideUp 0.3s ease;}
  .explainer.show{display:block;}
  .explainer.ok{background:rgba(16, 185, 129, 0.1); border:1px solid var(--green-border); color:var(--green);}
  .explainer.ng{background:rgba(239, 68, 68, 0.1); border:1px solid var(--red-border); color:var(--red);}

  .btn-main{width:100%; padding:1.15rem; background:var(--accent); color:#fff; border:none; border-radius:16px; font-size:16px; font-weight:700; cursor:pointer; font-family:var(--mono);}
</style>
</head>
<body>

<div class="app">
  <div class="screen active" id="home">
    <div class="topnav">
      <div class="badge badge-xp">⚡ <span id="h-xp">0</span> XP</div>
      <div class="hearts" id="h-hearts"></div>
    </div>
    <div class="hero">
      <h1 class="logo">Tag<span>Master</span></h1>
      <p class="tagline">// HTML & CSS CORE LEARNING</p>
    </div>
    <span class="section-title">학습 카테고리</span>
    <div class="grid">
      <div class="card sel" onclick="setTopic(this, 'all')"><span class="card-icon">⚡</span><span class="card-title">전체 학습</span><span class="card-sub">HTML+CSS 혼합</span></div>
      <div class="card" onclick="setTopic(this, 'html')"><span class="card-icon">🏗️</span><span class="card-title">HTML 기초</span><span class="card-sub">구조와 태그</span></div>
      <div class="card" onclick="setTopic(this, 'css-box')"><span class="card-icon">📦</span><span class="card-title">CSS 박스모델</span><span class="card-sub">Margin, Padding</span></div>
      <div class="card" onclick="setTopic(this, 'css-flex')"><span class="card-icon">🔲</span><span class="card-title">CSS 레이아웃</span><span class="card-sub">Flexbox 핵심</span></div>
    </div>
    <button class="btn-main" onclick="startQuiz()">학습 시작하기 →</button>
  </div>

  <div class="screen" id="quiz">
    <div class="topnav"><div id="q-progress" style="font-family:var(--mono); font-size:14px; font-weight:700;">Q. 1 / 5</div><div class="hearts" id="q-hearts"></div></div>
    <div class="q-card">
      <div id="q-tag" class="q-type">CSS FLEXBOX</div>
      <div id="q-txt" class="q-question"></div>
      <div id="q-code" class="code-view" style="display:none;"></div>
      <div id="q-options" class="options"></div>
      <div id="explainer" class="explainer"></div>
    </div>
    <button id="btn-next" class="btn-main" style="display:none;" onclick="nextQuestion()">다음 문제로 →</button>
  </div>

  <div class="screen" id="result" style="text-align:center;">
    <div style="font-size:60px; margin-bottom:1rem;">🏆</div>
    <h1 style="margin-bottom:2rem;">학습 완료!</h1>
    <div class="grid" style="grid-template-columns:1fr 1fr;">
      <div class="card"><span class="card-sub">정답수</span><span class="card-title" id="r-score" style="font-size:24px;">0</span></div>
      <div class="card"><span class="card-sub">획득 XP</span><span class="card-title" id="r-xp" style="font-size:24px;">0</span></div>
    </div>
    <button class="btn-main" onclick="location.reload()">홈으로</button>
  </div>
</div>

<script>
const PROBLEMS = [
  // HTML
  { topic:'html', type:'choice', q:'하이퍼링크를 만들 때 사용하는 태그는?', ans:'<a>', opts:['<a>', '<link>', '<href>', '<nav>'], info:'a 태그(Anchor)는 href 속성과 함께 사용하여 다른 페이지로 연결합니다.' },
  { topic:'html', type:'blank', q:'이미지를 삽입할 때 파일 경로를 지정하는 속성은?', code:'<img ___="logo.png" alt="로고">', blank:'src', ans:'src', opts:['src', 'href', 'url', 'path'], info:'src(Source)는 이미지나 스크립트 파일의 경로를 지정할 때 사용합니다.' },
  
  // CSS Box Model
  { topic:'css-box', type:'choice', q:'요소의 테두리(border)와 콘텐츠 사이의 "안쪽 여백"은?', ans:'padding', opts:['padding', 'margin', 'gap', 'spacing'], info:'Padding은 안쪽 여백, Margin은 테두리 바깥쪽의 여백을 의미합니다.' },
  { topic:'css-box', type:'blank', q:'테두리를 둥글게 만드는 CSS 속성은?', code:'.box {\n  ___: 10px;\n}', blank:'border-radius', ans:'border-radius', opts:['border-radius', 'corner-style', 'border-round', 'circle'], info:'border-radius를 통해 사각형 요소의 모서리를 곡선으로 만들 수 있습니다.' },
  
  // CSS Layout (Flexbox)
  { topic:'css-flex', type:'choice', q:'Flex 박스에서 주축(Main Axis) 방향을 정하는 속성은?', ans:'flex-direction', opts:['flex-direction', 'justify-content', 'align-items', 'flex-wrap'], info:'flex-direction은 아이템들이 가로(row)로 흐를지 세로(column)로 흐를지 결정합니다.' },
  { topic:'css-flex', type:'blank', q:'Flex 아이템들을 "주축"의 중앙에 정렬하는 속성은?', code:'.container {\n  display: flex;\n  ___: center;\n}', blank:'justify-content', ans:'justify-content', opts:['justify-content', 'align-items', 'align-content', 'place-items'], info:'justify-content는 주축 정렬, align-items는 교차축 정렬을 담당합니다.' },
  
  // Visuals
  { topic:'css-box', type:'choice', q:'배경색을 지정하는 CSS 속성은?', ans:'background-color', opts:['background-color', 'color', 'bg-color', 'fill'], info:'color는 텍스트의 색상을, background-color는 요소의 배경색을 지정합니다.' }
];

let state = {
  xp: parseInt(localStorage.getItem('tm_xp')) || 0,
  hearts: 5,
  topic: 'all',
  session: { currentIdx: 0, qs: [], score: 0, gainedXp: 0 }
};

function $(id) { return document.getElementById(id); }

function updateUI() {
  $('h-xp').textContent = state.xp;
  renderHearts('h-hearts');
  renderHearts('q-hearts');
}

function renderHearts(containerId) {
  const c = $(containerId); c.innerHTML = '';
  for(let i=0; i<5; i++) {
    const s = document.createElement('span');
    s.className = `heart ${i >= state.hearts ? 'dead' : ''}`;
    s.textContent = '❤️';
    c.appendChild(s);
  }
}

function setTopic(el, topic) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('sel'));
  el.classList.add('sel');
  state.topic = topic;
}

function startQuiz() {
  let pool = state.topic === 'all' ? PROBLEMS : PROBLEMS.filter(p => p.topic.includes(state.topic));
  state.session.qs = [...pool].sort(() => Math.random() - 0.5).slice(0, 5);
  state.session.currentIdx = 0;
  state.session.score = 0;
  state.session.gainedXp = 0;
  state.hearts = 5;
  showScreen('quiz');
  renderQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  updateUI();
}

function renderQuestion() {
  const q = state.session.qs[state.session.currentIdx];
  $('q-progress').textContent = `Q. ${state.session.currentIdx + 1} / ${state.session.qs.length}`;
  $('q-tag').textContent = q.topic.toUpperCase();
  $('q-txt').textContent = q.q;
  $('explainer').classList.remove('show');
  $('btn-next').style.display = 'none';
  
  if(q.type === 'blank') {
    $('q-code').style.display = 'block';
    $('q-code').innerHTML = q.code.replace('___', '<span class="blank">???</span>');
  } else {
    $('q-code').style.display = 'none';
  }

  $('q-options').innerHTML = '';
  q.opts.sort(() => Math.random() - 0.5).forEach(o => {
    const b = document.createElement('button');
    b.className = 'btn-opt';
    b.textContent = o;
    b.onclick = () => checkChoice(o, b);
    $('q-options').appendChild(b);
  });
}

function checkChoice(val, btn) {
  const q = state.session.qs[state.session.currentIdx];
  if($('btn-next').style.display === 'block') return;
  
  const isCorrect = val === q.ans;
  const exp = $('explainer');
  exp.className = `explainer show ${isCorrect ? 'ok' : 'ng'}`;
  exp.innerHTML = `<strong>${isCorrect ? '정답입니다! (+20 XP)' : '틀렸습니다!'}</strong><br>${q.info}`;
  
  if(isCorrect) {
    state.session.score++;
    state.session.gainedXp += 20;
    state.xp += 20;
  } else {
    state.hearts--;
    renderHearts('q-hearts');
    if(state.hearts <= 0) { setTimeout(() => endQuiz(), 1000); return; }
  }
  
  document.querySelectorAll('.btn-opt').forEach(b => {
    if(b.textContent === q.ans) b.classList.add('correct');
    else if(b === btn) b.classList.add('wrong');
    b.disabled = true;
  });
  
  $('btn-next').style.display = 'block';
  localStorage.setItem('tm_xp', state.xp);
}

function nextQuestion() {
  state.session.currentIdx++;
  if(state.session.currentIdx >= state.session.qs.length) endQuiz();
  else renderQuestion();
}

function endQuiz() {
  showScreen('result');
  $('r-score').textContent = `${state.session.score} / ${state.session.qs.length}`;
  $('r-xp').textContent = `+${state.session.gainedXp}`;
}

updateUI();
</script>
</body>
</html>
