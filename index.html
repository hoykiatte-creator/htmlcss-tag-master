<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TagMaster v3 — 스마트 웹 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0c10; --bg2:#12151c; --bg3:#1a1f29; --bg4:#252b38;
    --border:#242b38; --border2:#384252;
    --text:#f0f2f5; --text2:#a0aec0; --text3:#64748b;
    --accent:#7c6af7; --accent2:#5a4fd4;
    --green:#10b981; --green-bg:rgba(16,185,129,0.1);
    --red:#ef4444; --red-bg:rgba(239,68,68,0.1);
    --mono:'JetBrains Mono',monospace;
  }
  
  /* iOS Safari 렌더링 및 높이 이슈 해결 */
  html, body { height: 100%; -webkit-text-size-adjust: none; }
  body { 
    background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif;
    margin: 0; min-height: -webkit-fill-available; overflow-x: hidden;
  }

  .app { max-width: 500px; margin: 0 auto; padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom); display: flex; flex-direction: column; min-height: 100vh; }
  .screen { display: none; flex-direction: column; flex: 1; padding: 1.5rem 0; animation: fadeIn 0.3s ease; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  /* 컴팩트 헤더 */
  .topnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .badge { padding: 4px 10px; border-radius: 8px; font-family: var(--mono); font-size: 11px; font-weight: 600; background: var(--bg2); border: 1px solid var(--border); color: var(--text2); }

  /* 홈 Hero */
  .hero { text-align: center; padding: 1rem 0; }
  .logo { font-family: var(--mono); font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 4px; }
  .logo span { color: var(--accent); }

  /* 세분화된 카테고리 UI (컴팩트) */
  .section-label { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 1.5rem; }
  .card { 
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 0.75rem; 
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
  }
  .card:hover { border-color: var(--border2); background: var(--bg3); }
  .card.sel { border-color: var(--accent); background: #1e1b4b; box-shadow: 0 0 0 2px var(--accent); }
  .card-icon { font-size: 18px; }
  .card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 퀴즈 UI */
  .q-meta { font-family: var(--mono); font-size: 10px; color: var(--accent); margin-bottom: 0.5rem; display: flex; gap: 8px; font-weight: 700; }
  .q-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; margin-bottom: 1rem; }
  .q-txt { font-size: 16px; font-weight: 600; line-height: 1.5; margin-bottom: 1.25rem; }
  
  .code-view { background: #000; border: 1px solid var(--border2); border-radius: 10px; padding: 1rem; font-family: var(--mono); font-size: 13px; line-height: 1.6; margin-bottom: 1.25rem; color: #d1d5db; white-space: pre-wrap; overflow-x: auto; }
  .blank { color: var(--accent); font-weight: 700; text-decoration: underline; }

  .options { display: grid; gap: 8px; }
  .btn-opt { 
    background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 0.85rem 1rem; 
    color: var(--text); font-family: var(--mono); font-size: 13px; text-align: left; cursor: pointer; transition: 0.15s;
  }
  .btn-opt.correct { background: var(--green-bg); border-color: var(--green); color: var(--green); font-weight: 700; }
  .btn-opt.wrong { background: var(--red-bg); border-color: var(--red); color: var(--red); }
  .btn-opt:disabled { cursor: default; }

  /* 타이핑 입력창 최적화 */
  .input-area { display: flex; gap: 8px; }
  .input-box { 
    flex: 1; background: var(--bg3); border: 1.5px solid var(--border); border-radius: 12px; padding: 0.85rem; 
    color: var(--text); font-family: var(--mono); font-size: 16px; outline: none; width: 100%;
  }
  .input-box:focus { border-color: var(--accent); }

  .explainer { margin-top: 1rem; padding: 1rem; border-radius: 12px; font-size: 13px; line-height: 1.5; display: none; }
  .explainer.show { display: block; }
  .explainer.ok { background: var(--green-bg); border: 1px solid var(--green); color: var(--green); }
  .explainer.ng { background: var(--red-bg); border: 1px solid var(--red); color: var(--red); }

  /* 네비게이션 버튼 */
  .nav-btns { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: auto; }
  .btn-main { 
    padding: 1rem; background: var(--accent); color: #fff; border: none; border-radius: 14px; 
    font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--mono);
  }
  .btn-sub { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); border-radius: 14px; cursor: pointer; font-family: var(--mono); font-size: 14px; }
</style>
</head>
<body>

<div class="app">
  <div class="screen active" id="home">
    <div class="topnav">
      <div class="badge">TOTAL XP: <span id="h-xp">0</span></div>
    </div>
    <div class="hero">
      <h1 class="logo">Tag<span>Master</span> v3</h1>
    </div>
    <span class="section-label">학습 카테고리 (6파트)</span>
    <div class="grid">
      <div class="card sel" onclick="setTopic(this, 'all')"><span class="card-icon">⚡</span><span class="card-title">전체 랜덤</span></div>
      <div class="card" onclick="setTopic(this, 'struct')"><span class="card-icon">🏗️</span><span class="card-title">문서 구조</span></div>
      <div class="card" onclick="setTopic(this, 'content')"><span class="card-icon">🖋️</span><span class="card-title">텍스트/링크</span></div>
      <div class="card" onclick="setTopic(this, 'form')"><span class="card-icon">📋</span><span class="card-title">폼/입력</span></div>
      <div class="card" onclick="setTopic(this, 'css-box')"><span class="card-icon">📦</span><span class="card-title">박스모델</span></div>
      <div class="card" onclick="setTopic(this, 'css-flex')"><span class="card-icon">🔲</span><span class="card-title">Flex 레이아웃</span></div>
    </div>
    <button class="btn-main" onclick="startQuiz()">학습 시작하기 →</button>
  </div>

  <div class="screen" id="quiz">
    <div class="topnav">
      <div id="q-progress" style="font-family:var(--mono); font-size:12px; font-weight:700; color:var(--text3);">Q 1 / 5</div>
      <div class="badge" id="q-badge">HTML</div>
    </div>

    <div class="q-meta"><span id="meta-cat">STRUCTURE</span><span>|</span><span id="meta-type">CHOICE</span></div>
    
    <div class="q-card">
      <div id="q-txt" class="q-question"></div>
      <div id="q-code" class="code-view" style="display:none;"></div>
      <div id="q-options" class="options"></div>
      <div id="q-input-wrap" class="input-area" style="display:none;">
        <input type="text" id="q-input" class="input-box" placeholder="정답 입력..." autocomplete="off" onkeypress="if(event.keyCode==13) checkInputAnswer()">
        <button class="btn-main" style="width:auto; padding:0 1.25rem;" id="btn-input-check" onclick="checkInputAnswer()">확인</button>
      </div>
      <div id="explainer" class="explainer"></div>
    </div>

    <div class="nav-btns">
      <button class="btn-sub" id="btn-prev" onclick="prevQuestion()" style="visibility:hidden;">이전</button>
      <button class="btn-main" id="btn-next" onclick="handleNext()">다음 →</button>
    </div>
  </div>

  <div class="screen" id="result" style="text-align:center; justify-content:center;">
    <h1 style="font-size:24px; margin-bottom:1rem;">학습을 완료했습니다!</h1>
    <div class="grid" style="grid-template-columns:1fr 1fr;">
      <div class="card" style="justify-content:center; flex-direction:column; padding:1.5rem 0;">
        <span class="card-sub" style="font-size:11px; color:var(--text3);">정답</span>
        <span class="card-title" id="r-score" style="font-size:20px;">0 / 5</span>
      </div>
      <div class="card" style="justify-content:center; flex-direction:column; padding:1.5rem 0;">
        <span class="card-sub" style="font-size:11px; color:var(--text3);">XP</span>
        <span class="card-title" id="r-xp" style="font-size:20px;">+0</span>
      </div>
    </div>
    <button class="btn-main" onclick="location.reload()">홈으로 돌아가기</button>
  </div>
</div>

<script>
const PROBLEMS = [
  { topic:'struct', type:'choice', q:'HTML 문서의 최상위 루트 태그는?', ans:'<html>', opts:['<html>','<body>','<head>','<!DOCTYPE>'], info:'<html>은 모든 HTML 요소의 부모가 되는 루트 요소입니다.' },
  { topic:'struct', type:'input', q:'문서의 인코딩(UTF-8) 등을 설정하는 태그는?', ans:'meta', acc:['meta','<meta>'], info:'meta 태그는 문서의 정보를 제공하며 닫는 태그가 없습니다.' },
  { topic:'content', type:'blank', q:'이미지를 삽입할 때 파일 경로를 지정하는 속성은?', code:'<img ___="photo.jpg" alt="사진">', blank:'src', ans:'src', opts:['src','href','url','link'], info:'이미지는 src(Source), 링크는 href(Hypertext Reference)를 사용합니다.' },
  { topic:'form', type:'choice', q:'여러 옵션 중 하나만 선택할 때 쓰는 input 타입은?', ans:'radio', opts:['radio','checkbox','text','submit'], info:'radio는 택일, checkbox는 다중 선택에 사용합니다.' },
  { topic:'css-box', type:'input', q:'요소의 바깥쪽 여백을 의미하는 속성은?', ans:'margin', acc:['margin'], info:'margin은 테두리 밖, padding은 테두리 안 여백입니다.' },
  { topic:'css-flex', type:'blank', q:'Flex 아이템의 주축(Main Axis) 정렬 속성은?', code:'.box {\n  display: flex;\n  ___: center;\n}', blank:'justify-content', ans:'justify-content', opts:['justify-content','align-items','flex-direction','gap'], info:'justify-content는 주축 방향 정렬을 제어합니다.' }
];

let state = {
  xp: parseInt(localStorage.getItem('tm_xp_v3')) || 0,
  topic: 'all',
  session: {
    idx: 0,
    qs: [],
    userAnswers: [], // { choice: string, isCorrect: boolean }
    score: 0
  }
};

function $(id) { return document.getElementById(id); }

function updateHomeUI() { $('h-xp').textContent = state.xp; }

function setTopic(el, topic) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('sel'));
  el.classList.add('sel');
  state.topic = topic;
}

function startQuiz() {
  let pool = state.topic === 'all' ? PROBLEMS : PROBLEMS.filter(p => p.topic === state.topic);
  state.session.qs = [...pool].sort(() => Math.random() - 0.5).slice(0, 5);
  state.session.idx = 0;
  state.session.userAnswers = new Array(state.session.qs.length).fill(null);
  state.session.score = 0;
  
  showScreen('quiz');
  renderQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0); // iOS 스크롤 이슈 방지
}

function renderQuestion() {
  const s = state.session;
  const q = s.qs[s.idx];
  const history = s.userAnswers[s.idx];

  $('q-progress').textContent = `QUESTION ${s.idx + 1} / ${s.qs.length}`;
  $('meta-cat').textContent = q.topic.toUpperCase();
  $('meta-type').textContent = q.type.toUpperCase();
  $('q-badge').textContent = q.topic.includes('css') ? 'CSS' : 'HTML';
  $('q-txt').textContent = q.q;
  
  // UI 초기화
  $('q-code').style.display = q.type === 'blank' ? 'block' : 'none';
  $('q-options').style.display = (q.type === 'choice' || q.type === 'blank') ? 'grid' : 'none';
  $('q-input-wrap').style.display = q.type === 'input' ? 'flex' : 'none';
  $('explainer').classList.remove('show');
  $('btn-prev').style.visibility = s.idx > 0 ? 'visible' : 'hidden';
  $('btn-next').textContent = history ? (s.idx === s.qs.length - 1 ? '결과 보기' : '다음 →') : '건너뛰기';

  if(q.type === 'blank') {
    $('q-code').innerHTML = q.code.replace('___', `<span class="blank">${history ? history.choice : '???'}</span>`);
  }

  // 선택지 렌더링
  if($('q-options').style.display === 'grid') {
    $('q-options').innerHTML = '';
    q.opts.forEach(o => {
      const b = document.createElement('button');
      b.className = 'btn-opt';
      b.textContent = o;
      if(history) {
        if(o === q.ans) b.classList.add('correct');
        else if(o === history.choice) b.classList.add('wrong');
        b.disabled = true;
      } else {
        b.onclick = () => checkChoice(o, b);
      }
      $('q-options').appendChild(b);
    });
  }

  // 주관식 렌더링
  if(q.type === 'input') {
    $('q-input').value = history ? history.choice : '';
    $('q-input').disabled = !!history;
    $('btn-input-check').style.display = history ? 'none' : 'block';
  }

  // 이미 푼 문제라면 해설 바로 표시
  if(history) showFeedback(history.isCorrect, q.ans, q.info);
}

function checkChoice(val, btn) {
  const q = state.session.qs[state.session.idx];
  const isCorrect = val === q.ans;
  recordAnswer(val, isCorrect);
  renderQuestion();
}

function checkInputAnswer() {
  const q = state.session.qs[state.session.idx];
  if(!q || q.type !== 'input') return;
  const val = $('q-input').value.trim().toLowerCase();
  if(!val) return;
  const isCorrect = q.acc.some(a => a.toLowerCase() === val);
  recordAnswer(val, isCorrect);
  renderQuestion();
}

function recordAnswer(choice, isCorrect) {
  state.session.userAnswers[state.session.idx] = { choice, isCorrect };
  if(isCorrect) {
    state.session.score++;
    state.xp += 20;
    localStorage.setItem('tm_xp_v3', state.xp);
  }
}

function showFeedback(isCorrect, correctAns, info) {
  const exp = $('explainer');
  exp.className = `explainer show ${isCorrect ? 'ok' : 'ng'}`;
  exp.innerHTML = `<strong>${isCorrect ? '정답입니다!' : '오답입니다. (정답: '+correctAns+')'}</strong><br>${info}`;
}

function handleNext() {
  const s = state.session;
  if(s.idx < s.qs.length - 1) {
    s.idx++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function prevQuestion() {
  if(state.session.idx > 0) {
    state.session.idx--;
    renderQuestion();
  }
}

function finishQuiz() {
  showScreen('result');
  $('r-score').textContent = `${state.session.score} / ${state.session.qs.length}`;
  $('r-xp').textContent = `+${state.session.score * 20}`;
}

updateHomeUI();
</script>
</body>
</html>
